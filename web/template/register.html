{{define "register"}}

{{template "header" .}}

<h1>Регистрация</h1>

<form action="/api/register" method="POST">

    <div>
        <label for="name">Имя</label>
        <input
            type="name"
            id="name"
            name="name"
            required
        >
    </div>

    <div>
        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >
    </div>

    <div>
        <label for="password">Пароль</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
    </div>

    <div>
        <label for="password_confirm">Повторите пароль</label>
        <input
            type="password"
            id="password_confirm"
            name="password_confirm"
            required
        >
    </div>

    <button type="submit">Зарегистрироваться</button>
</form>

<p>
    Уже есть аккаунт?
    <a href="/api/login">Войти</a>
</p>

{{template "footer" .}}
{{end}}
